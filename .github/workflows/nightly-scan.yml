name: nightly-scan

# Runs the drift scan against the date-selected synthetic fixture, then commits
# the result artifacts back to the repo. Vercel redeploys on the push and the
# stdlib endpoints (api/stats.py, api/incident-latest.py) read the committed
# files. No external persistence.
#
# The default branch is protected by the "main protection" ruleset, so the
# default GITHUB_TOKEN cannot push to it. We mint a short-lived token from a
# scoped GitHub App (fleet-bot) that is on the ruleset bypass list, and push
# with that. Human PRs are still required for everyone else — only this app can
# write the nightly telemetry diff. Requires two repo secrets:
#   FLEET_BOT_APP_ID, FLEET_BOT_PRIVATE_KEY

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read # the app token (not GITHUB_TOKEN) performs the write

concurrency:
  group: nightly-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Mint fleet-bot app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.FLEET_BOT_APP_ID }}
          private-key: ${{ secrets.FLEET_BOT_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e .

      - name: Run drift scan
        run: python -m data_quality_watchtower.incident_runner

      - name: Resolve app bot identity
        id: bot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          slug="${{ steps.app-token.outputs.app-slug }}"
          uid="$(gh api "/users/${slug}[bot]" --jq .id)"
          echo "name=${slug}[bot]" >> "$GITHUB_OUTPUT"
          echo "email=${uid}+${slug}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - name: Commit artifacts if changed
        run: |
          git config user.name "${{ steps.bot.outputs.name }}"
          git config user.email "${{ steps.bot.outputs.email }}"
          git add api/_incident_latest.json api/_incident_history.json reports/
          if git diff --cached --quiet; then
            echo "No telemetry changes to commit."
          else
            git commit -m "chore(telemetry): nightly drift scan $(date -u +%Y-%m-%d) [skip ci]"
            git push
          fi
